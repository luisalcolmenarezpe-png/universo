<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tu Galaxia de Flores Amarillas 🌻</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050510;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; /* Evita que la pantalla baje o suba */
            touch-action: none; /* Desactiva gestos nativos para poder girar la galaxia */
        }

        #ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Deja pasar los toques al canvas */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 30px 0;
            box-sizing: border-box;
            z-index: 10;
        }

        h1 {
            text-align: center;
            font-size: 2.2rem;
            color: #ffcc00;
            text-shadow: 0 0 15px #ffcc00, 0 0 30px #ff9900;
            margin: 0;
        }

        .instructions {
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            color: #ddd;
            border: 1px solid #ffcc0055;
            text-align: center;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

    <div id="ui-container">
        <h1>Feliz día de las<br>Flores Amarillas 🌻</h1>
        <div class="instructions">
            👆 Desliza para mover la galaxia<br>🔍 Pellizca para acercar o alejar
        </div>
    </div>

    <canvas id="galaxy"></canvas>

    <script>
        const canvas = document.getElementById('galaxy');
        const ctx = canvas.getContext('2d');

        let width, height;
        let centerX, centerY;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            centerX = width / 2;
            centerY = height / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- PARÁMETROS DE LA GALAXIA ---
        const particles = [];
        const numParticles = 400; // ¡Cientos de elementos!
        const frases = [
            "Eres mi favorita", "Luz en mi vida", "Sonríe siempre", 
            "Un detalle amarillo", "Pura magia", "Te quiero", 
            "Mi universo", "Brillas", "Mi sol", "Siempre tú"
        ];
        const emojis = ["🌻", "🌻", "🌻", "🌼", "✨", "💛", "🌟"];

        // Variables de cámara e interacción
        let zoom = 1.2;
        let pitch = 60 * Math.PI / 180; // Inclinación inicial
        let yaw = 0; // Rotación de cámara
        let autoRotateSpeed = 0.002;
        let time = 0;

        // Crear las partículas (flores y frases)
        for (let i = 0; i < numParticles; i++) {
            let isText = Math.random() > 0.75; // 25% frases, 75% flores/estrellas
            
            particles.push({
                angle: Math.random() * Math.PI * 2, // Posición en el círculo
                radius: 80 + Math.random() * 600, // Distancia desde el centro (tamaño de galaxia)
                yOffset: (Math.random() - 0.5) * 60, // Grosor de la galaxia
                speed: (Math.random() * 0.003 + 0.001) * (Math.random() > 0.5 ? 1 : -1), // Velocidades y direcciones distintas
                isText: isText,
                content: isText ? frases[Math.floor(Math.random() * frases.length)] : emojis[Math.floor(Math.random() * emojis.length)],
                size: isText ? (12 + Math.random() * 6) : (16 + Math.random() * 20)
            });
        }

        // --- INTERACCIÓN (TÁCTIL Y MOUSE) ---
        let isDragging = false;
        let lastX = 0;
        let lastY = 0;
        let initialPinchDistance = null;

        // Soporte para Mouse
        canvas.addEventListener('mousedown', e => { isDragging = true; lastX = e.clientX; lastY = e.clientY; });
        canvas.addEventListener('mouseup', () => { isDragging = false; });
        canvas.addEventListener('mousemove', e => {
            if (isDragging) {
                let dx = e.clientX - lastX;
                let dy = e.clientY - lastY;
                yaw += dx * 0.01;   // Cambia la dirección al deslizar horizontalmente
                pitch -= dy * 0.01; // Cambia la inclinación al deslizar verticalmente
                
                // Limitar la inclinación para que no se voltee por completo
                pitch = Math.max(0.1, Math.min(pitch, Math.PI - 0.1));
                lastX = e.clientX;
                lastY = e.clientY;
            }
        });
        canvas.addEventListener('wheel', e => {
            zoom -= e.deltaY * 0.002;
            zoom = Math.max(0.3, Math.min(zoom, 4)); // Limitar zoom
        });

        // Soporte para Celular (Touch)
        canvas.addEventListener('touchstart', e => {
            if (e.touches.length === 1) {
                isDragging = true;
                lastX = e.touches[0].clientX;
                lastY = e.touches[0].clientY;
            } else if (e.touches.length === 2) {
                // Iniciar zoom por pellizco
                initialPinchDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
            }
        });
        canvas.addEventListener('touchend', e => {
            isDragging = false;
            initialPinchDistance = null;
        });
        canvas.addEventListener('touchmove', e => {
            if (e.touches.length === 1 && isDragging) {
                let dx = e.touches[0].clientX - lastX;
                let dy = e.touches[0].clientY - lastY;
                
                yaw += dx * 0.008; // Arrastrar cambia la rotación
                pitch -= dy * 0.008;
                pitch = Math.max(0.1, Math.min(pitch, Math.PI - 0.1));
                
                lastX = e.touches[0].clientX;
                lastY = e.touches[0].clientY;
            } else if (e.touches.length === 2 && initialPinchDistance) {
                // Hacer zoom (pellizcar)
                let currentDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                let diff = currentDistance - initialPinchDistance;
                zoom += diff * 0.005;
                zoom = Math.max(0.3, Math.min(zoom, 5));
                initialPinchDistance = currentDistance;
            }
        });

        // --- BUCLE DE ANIMACIÓN ---
        function draw() {
            ctx.fillStyle = '#050510';
            ctx.fillRect(0, 0, width, height);

            time += autoRotateSpeed;

            let projectedParticles = [];

            // 1. Calcular posiciones 3D
            particles.forEach(p => {
                // Rotación orbital propia
                let currentAngle = p.angle + time * (p.speed * 100);
                
                // Coordenadas base en 3D
                let x = Math.cos(currentAngle) * p.radius;
                let z = Math.sin(currentAngle) * p.radius;
                let y = p.yOffset;

                // Aplicar rotación de la cámara (Yaw - horizontal)
                let x1 = x * Math.cos(yaw) - z * Math.sin(yaw);
                let z1 = x * Math.sin(yaw) + z * Math.cos(yaw);

                // Aplicar inclinación de la cámara (Pitch - vertical)
                let y2 = y * Math.cos(pitch) - z1 * Math.sin(pitch);
                let z2 = y * Math.sin(pitch) + z1 * Math.cos(pitch);

                // Proyección a 2D (Perspectiva)
                let focalLength = 800;
                let scale = focalLength / (focalLength + z2);

                if (scale > 0) { // Solo si está frente a la cámara
                    projectedParticles.push({
                        screenX: centerX + x1 * scale * zoom,
                        screenY: centerY + y2 * scale * zoom,
                        scale: scale * zoom,
                        depth: z2, // Guardamos la profundidad para ordenarlos
                        content: p.content,
                        isText: p.isText,
                        baseSize: p.size
                    });
                }
            });

            // 2. ORDENAR POR PROFUNDIDAD (Z-Index real)
            // Esto soluciona que las cosas de atrás tapen a las de adelante
            projectedParticles.sort((a, b) => b.depth - a.depth);

            // 3. Dibujar Sol Central
            let sunScale = (800 / (800 + 0)) * zoom; // Centro está en z=0
            ctx.beginPath();
            ctx.arc(centerX, centerY, 40 * sunScale, 0, Math.PI * 2);
            let gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 40 * sunScale);
            gradient.addColorStop(0, '#ffffdd');
            gradient.addColorStop(0.3, '#ffcc00');
            gradient.addColorStop(1, 'transparent');
            ctx.fillStyle = gradient;
            ctx.fill();
            
            // Resplandor del sol
            ctx.shadowBlur = 50 * sunScale;
            ctx.shadowColor = '#ff8800';
            ctx.beginPath();
            ctx.arc(centerX, centerY, 20 * sunScale, 0, Math.PI * 2);
            ctx.fillStyle = '#ffcc00';
            ctx.fill();
            ctx.shadowBlur = 0; // Apagar resplandor para el resto

            // 4. Dibujar Flores y Textos
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            projectedParticles.forEach(p => {
                let finalSize = p.baseSize * p.scale;
                
                // Si se aleja mucho y se hace muy pequeño, no lo dibujamos para optimizar
                if (finalSize < 2) return; 

                ctx.font = `bold ${finalSize}px 'Segoe UI', sans-serif`;
                
                if (p.isText) {
                    // Sombra para los textos para que resalten
                    ctx.fillStyle = '#ffeaa0';
                    ctx.shadowBlur = 4;
                    ctx.shadowColor = '#000000';
                    ctx.fillText(p.content, p.screenX, p.screenY);
                    ctx.shadowBlur = 0;
                } else {
                    // Flores
                    ctx.fillText(p.content, p.screenX, p.screenY);
                }
            });

            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
