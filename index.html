<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Universo de Flores Amarillas 🌻</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #020205;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none; /* Previene el scroll nativo */
        }
        #ui {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }
        h1 {
            color: #ffcc00;
            font-size: 2rem;
            margin: 0;
            text-shadow: 0 0 15px #ffcc00, 0 0 30px #ff8800;
        }
        p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div id="ui">
        <h1>Feliz día de las Flores Amarillas</h1>
        <p>Gira la galaxia con un dedo. Pellizca para acercar.</p>
    </div>

    <!-- Importar Three.js y OrbitControls desde CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // 1. CONFIGURACIÓN BASE 3D
        const scene = new THREE.Scene();
        // Fondo del espacio
        scene.background = new THREE.Color(0x020205);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 15, 35); // Posición inicial de la cámara

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio); // Texturas nítidas en móviles
        document.body.appendChild(renderer.domElement);

        // 2. CONTROLES DE CÁMARA (Navegación 3D profesional)
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; // Movimiento suave con inercia
        controls.dampingFactor = 0.05;
        controls.enablePan = false; // Evita que se salga del centro
        controls.minDistance = 10; // Límite de zoom in
        controls.maxDistance = 100; // Límite de zoom out

        // 3. ESTRELLAS DE FONDO (Sistema de partículas 3D)
        const starsGeometry = new THREE.BufferGeometry();
        const starsMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.1 });
        const starsVertices = [];
        for (let i = 0; i < 2000; i++) {
            const x = THREE.MathUtils.randFloatSpread(200);
            const y = THREE.MathUtils.randFloatSpread(200);
            const z = THREE.MathUtils.randFloatSpread(200);
            starsVertices.push(x, y, z);
        }
        starsGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starsVertices, 3));
        const starField = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(starField);

        // 4. SOL CENTRAL (Esfera amarilla brillante)
        const sunGeometry = new THREE.SphereGeometry(3, 32, 32);
        const sunMaterial = new THREE.MeshBasicMaterial({ color: 0xffcc00 });
        const sun = new THREE.Mesh(sunGeometry, sunMaterial);
        scene.add(sun);

        // Crear un resplandor (Glow) usando un Sprite detrás del sol
        const glowCanvas = document.createElement('canvas');
        glowCanvas.width = 128; glowCanvas.height = 128;
        const glowCtx = glowCanvas.getContext('2d');
        const glowGradient = glowCtx.createRadialGradient(64, 64, 0, 64, 64, 64);
        glowGradient.addColorStop(0, 'rgba(255, 204, 0, 1)');
        glowGradient.addColorStop(0.4, 'rgba(255, 136, 0, 0.5)');
        glowGradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
        glowCtx.fillStyle = glowGradient;
        glowCtx.fillRect(0, 0, 128, 128);
        const glowTexture = new THREE.CanvasTexture(glowCanvas);
        const glowMaterial = new THREE.SpriteMaterial({ map: glowTexture, blending: THREE.AdditiveBlending, transparent: true });
        const sunGlow = new THREE.Sprite(glowMaterial);
        sunGlow.scale.set(12, 12, 1);
        scene.add(sunGlow);

        // 5. SISTEMA DE ANILLOS (Textos y Flores)
        const ringsGroup = new THREE.Group();
        scene.add(ringsGroup);

        // Función para crear textos nítidos en 3D
        function createTextSprite(text, isEmoji = false) {
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = 512;
            canvas.height = 128;
            
            context.font = isEmoji ? "bold 60px sans-serif" : "bold 40px 'Segoe UI', Tahoma, sans-serif";
            context.textAlign = "center";
            context.textBaseline = "middle";
            
            // Sombra para que resalte
            context.shadowColor = "#ff8800";
            context.shadowBlur = isEmoji ? 15 : 10;
            context.fillStyle = isEmoji ? "#ffffff" : "#ffeaa0";
            
            context.fillText(text, canvas.width / 2, canvas.height / 2);
            
            const texture = new THREE.CanvasTexture(canvas);
            const material = new THREE.SpriteMaterial({ map: texture, transparent: true });
            const sprite = new THREE.Sprite(material);
            
            // Ajustar escala para que no se vea estirado
            sprite.scale.set(12, 3, 1);
            return sprite;
        }

        const phrases = [
            "Eres mi favorita", "Luz en mi vida", "Sonríe siempre", 
            "Un detalle amarillo", "Pura magia", "Te quiero", 
            "Mi universo", "Siempre brillas", "Atesoro tu compañía"
        ];

        // Anillo interno: Flores
        const radius1 = 9;
        for (let i = 0; i < 12; i++) {
            const angle = (i / 12) * Math.PI * 2;
            const sprite = createTextSprite("🌻", true);
            sprite.position.set(Math.cos(angle) * radius1, Math.sin(angle * 2) * 1.5, Math.sin(angle) * radius1);
            ringsGroup.add(sprite);
        }

        // Anillo medio: Textos románticos
        const radius2 = 15;
        for (let i = 0; i < phrases.length; i++) {
            const angle = (i / phrases.length) * Math.PI * 2;
            const sprite = createTextSprite(phrases[i], false);
            // Inclinación ligera en el eje Y para darle volumen al anillo
            sprite.position.set(Math.cos(angle) * radius2, Math.cos(angle * 3) * 2, Math.sin(angle) * radius2);
            ringsGroup.add(sprite);
        }

        // Anillo externo: Mezcla de estrellas, corazones y flores
        const radius3 = 22;
        const mix = ["✨", "💛", "🌻", "🌟", "💐"];
        for (let i = 0; i < 18; i++) {
            const angle = (i / 18) * Math.PI * 2;
            const item = mix[i % mix.length];
            const sprite = createTextSprite(item, true);
            sprite.position.set(Math.cos(angle) * radius3, Math.sin(angle * 4) * 3, Math.sin(angle) * radius3);
            ringsGroup.add(sprite);
        }

        // Inclinación inicial del sistema de anillos
        ringsGroup.rotation.x = Math.PI / 6; 

        // 6. REDIMENSIONAMIENTO RESPONSIVO
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 7. BUCLE DE ANIMACIÓN
        function animate() {
            requestAnimationFrame(animate);
            
            // Rotación automática muy lenta y elegante de la galaxia
            ringsGroup.rotation.y -= 0.002;
            
            // Actualizar controles (necesario para el damping/inercia)
            controls.update();
            
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
