<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para ti 🌻</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; /* Evita barras de desplazamiento */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Estrellas de fondo */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            animation: twinkle infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        /* Título principal */
        .title {
            position: absolute;
            top: 10%;
            text-align: center;
            font-size: 2.5rem;
            color: #ffcc00;
            text-shadow: 0 0 10px #ffcc00, 0 0 20px #ff9900;
            z-index: 10;
        }

        /* Contenedor 3D y Anillo */
        .scene {
            width: 100%;
            height: 50vh;
            perspective: 800px; /* Profundidad 3D */
            position: relative;
            z-index: 5;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ring {
            position: relative;
            width: 300px;
            height: 300px;
            transform-style: preserve-3d;
            animation: rotateRing 20s linear infinite; /* Rota todo el anillo */
        }

        /* Animación de rotación del anillo completo */
        @keyframes rotateRing {
            0% { transform: rotateX(70deg) rotateZ(0deg); } /* Inclinación de 70deg */
            100% { transform: rotateX(70deg) rotateZ(360deg); }
        }

        /* Estilos para los elementos dentro del anillo */
        .item {
            position: absolute;
            top: 50%;
            left: 50%;
            transform-style: preserve-3d;
            /* El transform se aplica dinámicamente con JS */
            text-align: center;
            white-space: nowrap;
        }

        /* Los mensajes y flores deben "mirar" hacia la cámara (deshacer la inclinación) */
        .item-content {
            display: inline-block;
            /* Animación contraria para que siempre miren hacia arriba/adelante */
            animation: counterRotate 20s linear infinite; 
            text-shadow: 0 0 5px rgba(255, 204, 0, 0.8);
        }

        @keyframes counterRotate {
            0% { transform: rotateZ(0deg) rotateX(-70deg); }
            100% { transform: rotateZ(-360deg) rotateX(-70deg); }
        }

        /* Estilos específicos de texto y emojis */
        .msg {
            color: #ffeba1;
            font-size: 0.9rem;
            font-weight: bold;
        }
        
        .emoji-flower {
            font-size: 2rem;
            filter: drop-shadow(0 0 8px rgba(255,200,0,0.6));
        }

        /* El sol/planeta central */
        .center-sun {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotateX(-70deg); /* Deshacer inclinación de la escena */
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, #ffe600 0%, #ff8c00 70%, transparent 100%);
            border-radius: 50%;
            box-shadow: 0 0 40px #ffcc00, 0 0 80px #ff8c00;
            z-index: 10;
        }

        /* Música (oculto) */
        audio {
            display: none;
        }

    </style>
</head>
<body>

    <!-- Fondo de estrellas -->
    <div class="stars" id="stars-container"></div>

    <!-- Título -->
    <h1 class="title">Feliz día de las<br>Flores Amarillas 🌻</h1>

    <!-- Escena 3D -->
    <div class="scene">
        <!-- Centro brillante -->
        <div class="center-sun"></div>
        
        <!-- Anillo giratorio -->
        <div class="ring" id="ring">
            <!-- Los elementos se inyectarán aquí con JavaScript -->
        </div>
    </div>

    <!-- Audio (Opcional, debes poner un enlace válido) -->
    <!-- <audio autoplay loop src="ENLACE_A_CANCION_FLORICIENTA.mp3"></audio> -->

    <script>
        // --- 1. GENERAR ESTRELLAS DE FONDO ---
        const starsContainer = document.getElementById('stars-container');
        for (let i = 0; i < 150; i++) {
            let star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + 'vw';
            star.style.top = Math.random() * 100 + 'vh';
            let size = Math.random() * 3;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.animationDuration = (Math.random() * 2 + 1) + 's';
            star.style.animationDelay = Math.random() * 2 + 's';
            starsContainer.appendChild(star);
        }

        // --- 2. GENERAR EL ANILLO DE MENSAJES Y FLORES ---
        const ring = document.getElementById('ring');
        const numItems = 24; // Cantidad total de elementos en el anillo
        const radius = 250;  // Radio del círculo (distancia desde el centro)

        // Textos que aparecerán (puedes personalizarlos)
        const messages = [
            "Eres mi flor favorita", "🌻", "Sonríe siempre", "Para ti", 
            "🌻", "Luz en mi vida", "Un detalle amarillo", "💐", 
            "Pura luz ✨", "Siempre brillas", "🌻", "Atesoro tu compañía",
            "Eres muy especial", "🌻", "Alegras mis días", "💛"
        ];

        for (let i = 0; i < numItems; i++) {
            let itemDiv = document.createElement('div');
            itemDiv.className = 'item';

            // Calcular el ángulo para distribuir los elementos en un círculo completo
            let angle = (i / numItems) * 360;

            // Aplicar la rotación y la traslación (radio)
            // Se usa translateZ para moverlo hacia afuera en 3D
            itemDiv.style.transform = `rotateZ(${angle}deg) translateY(-${radius}px)`;

            let contentDiv = document.createElement('div');
            contentDiv.className = 'item-content';

            // Seleccionar texto o emoji
            let contentText = messages[i % messages.length];
            if (contentText === "🌻" || contentText === "💐" || contentText === "💛") {
                contentDiv.innerHTML = `<span class="emoji-flower">${contentText}</span>`;
            } else {
                contentDiv.innerHTML = `<span class="msg">${contentText}</span>`;
            }

            itemDiv.appendChild(contentDiv);
            ring.appendChild(itemDiv);
        }
    </script>
</body>
</html>
